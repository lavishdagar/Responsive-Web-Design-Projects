<!DOCTYPE html>
<html>

<head>
  <meta content="width=device-width, initial-scale=1.0" name-"viewport">
  <title>Palindrome checker</title>
  <meta charset="utf-8">
  <style>
    body {
      font-family: sans-serif;
      background-color: #0A0B20;
      color: #ffffff;
    }

    body>h1 {
      position: relative;
      margin: auto;
      width: 50%;
      top: 100px;
      font-size: 50px;
      text-align: center;

    }

    #first-div {
      background-color: white;
      height: 160px;
      width: 500px;
      margin: auto;
      margin-top: 150px;
      border-radius: 20px;
      color: black;

    }

    div label {
      font-size: 20px;
      position: relative;
      left: 15%;
      top: 35px;

    }

    #text-input {
      position: relative;
      top: 60px;
      width: 55%;
      left: 15%;
      height: 30px;
      border: none;
      border-bottom: solid black 1px;
    }

    #check-btn {
      position: relative;
      left: 75px;
      top: 67px;
      width: 20%;
      height: 25px;
      font-size: 15px;
      border-radius: 25px;
    }

    #div-2 {
      background-color: #123456;
      height: 120px;
      width: 500px;
      margin: auto;
      margin-top: 60px;
      border-radius: 20px;
      color: #fff;
    }

    #div-2 p {
      font-size: 20px;
      position: relative;
      left: 25px;
      top: 18px;

    }

    #result {
      position: relative;
      top: 90px;
      text-align: center;
      left: -10px;
      font-size: 20px;
      color: #af1345;

    }
  </style>
</head>

<body>
  <h1>Is it a Palindrome?</h1>
  <div id="first-div">
    <label for="text-input">Enter in text to check for a palindrome:</label>
    <input id="text-input" type="text" />
    <button id="check-btn">Check</button>
    <p id="result"></p>
  </div>
  <div id="div-2">
    <p> A palindrome is a word or sentence that's spelled the same way both forward and backward, ignoring punctuation,
      case, and spacing.</p>
  </div>
  <script>
    const text_input = document.getElementById("text-input");
    const button_input = document.getElementById("check-btn");
    const result = document.getElementById("result");
    function checkPalindrome(str) {
      str = str.toLowerCase();
      const reversedStr = str.split('').reverse().join('');
      return str === reversedStr;
    }


    button_input.addEventListener("click", function () {
      if (text_input.value.trim() == '') {
        alert("Please input a value");
      }
      else {
        const str = text_input.value.replace(/[^a-zA-Z]/g, '');
        document.getElementById("first-div").style.height = "230px";
        if (checkPalindrome(str)) {
          result.innerText = `${text_input.value} is a palindrome`;

        }
        else {
          result.innerText = `${text_input.value} is not a palindrome`;

        }
      }
    }
    );
  </script>
</body>

</html>
